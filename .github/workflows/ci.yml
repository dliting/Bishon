name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Run backend unit tests
        env:
          VECTOR_DB_USE_GPU: "false"
          RERANK_USE_GPU: "false"
          OCR_USE_GPU: "false"
        run: pytest tests/backend/unit -v --timeout=180

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front_end/package-lock.json

      - name: Install dependencies
        working-directory: front_end
        # --legacy-peer-deps: pinia-plugin-persistedstate's pinia peer dep
        # requires vue ^3.5.11, but this project pins vue at 3.3. Tracked
        # for upgrade in v2.1.
        run: npm ci --legacy-peer-deps

      - name: Run frontend unit tests
        working-directory: front_end
        run: npx vitest run

      - name: Build frontend
        working-directory: front_end
        run: npm run build

  shell:
    # Bash scripts under docker/, scripts/docker/, and tests/scripts/.
    # All shell-side logic lives in scripts/ci/shell-checks.sh — this job
    # just calls the script. bats is auto-resolved (system bats if present,
    # otherwise the vendored third_party/bats-core/). Migrating to GitLab
    # CI / Gitea Actions / Jenkins is a 1-line change (see docs/ci.md).
    name: Shell (bats)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell checks
        run: bash scripts/ci/shell-checks.sh
